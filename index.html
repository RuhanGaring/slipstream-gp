<!-- the boot screen: drawn on the first paint, before any of the (large) scripts below load -->
<style>
#boot { position: fixed; inset: 0; z-index: 100; background: #0b0b10; color: #f4f6f8; font-family: 'Titillium Web', 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; justify-content: center; padding: 0 9vw; transition: opacity .6s ease; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .bm { display: flex; align-items: center; gap: 16px; font-weight: 900; font-style: italic; font-size: clamp(40px, 6.4vw, 96px); line-height: .9; letter-spacing: -.01em; }
#boot .bm i { width: clamp(44px, 5vw, 76px); height: clamp(18px, 2vw, 30px); background: #e10600; transform: skewX(-32deg); flex: none; }
#boot .bs { margin: 14px 0 0 calc(clamp(44px, 5vw, 76px) + 16px); font-size: clamp(13px, 1.3vw, 18px); font-weight: 700; letter-spacing: .5em; color: #9a9aa8; }
#boot .bp { position: absolute; left: 9vw; right: 9vw; bottom: 12vh; }
#boot .bt { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #c9c9d3; margin-bottom: 10px; }
#boot .bt b { color: #fff; font-variant-numeric: tabular-nums; }
#boot .bb { position: relative; height: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
#boot .bb i { position: absolute; inset: 0; background: #e10600; transform-origin: left; transform: scaleX(var(--p, 0.02)); transition: transform .35s ease; }
/* runs on the compositor, so it keeps moving while a script is being parsed */
#boot .bb u { position: absolute; top: 0; bottom: 0; width: 18%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: bootSweep 1.1s linear infinite; }
@keyframes bootSweep { from { transform: translateX(-100%); } to { transform: translateX(560%); } }
</style>
<script>
  // progress for the boot screen: p 0..1 and what is happening
  window.__boot = function (p, t) {
    var b = document.getElementById('boot'); if (!b) return;
    b.style.setProperty('--p', p);
    document.getElementById('boot-n').textContent = Math.round(p * 100) + '%';
    if (t) document.getElementById('boot-t').textContent = t;
  };
  window.__bootDone = function () {
    var b = document.getElementById('boot'); if (!b || b.classList.contains('out')) return;
    window.__boot(1);
    b.classList.add('out');
    setTimeout(function () { b.remove(); }, 700);
  };
</script>
